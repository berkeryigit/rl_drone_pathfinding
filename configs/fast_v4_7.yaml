# v4.7 — SENTEZ: v4.5'in güvenli rejimini koru, tarama derinliğini güvenli yoldan artır.
#   Öğrenilen: far_voxel ÇOK HASSAS (1.0=güvenli %8, 1.5=tehlikeli %93) -> 1.0'da KAL.
#   v4.6 dersi: far_voxel ile zorlamak güvenliği bozar. Onun yerine:
#     - far_voxel 1.0 SABIT (v4.5 güvenli nokta)
#     - idle_grace 30->20 + idle 0.06->0.08: donup/transit geçmeyi caydır, AKTİF tara
#       (güvenlik-nötr: dışa agresif itmez, sadece boş durmayı cezalandırır)
#     - 4M eğitim: güvenli politikanın daha verimli/derin taramayı öğrenmesi için zaman
#   Hedef: çarpışma <%15 KORU, voxel 114 -> 140+.
env:
  max_episode_steps: 2500
  seed: 42
  lidar_history: 2
  room_bonus: 30.0
  idle_penalty: 0.08        # 0.06 -> 0.08 (boş durmayı caydır, tarayı sürdür)
  idle_grace: 20            # 30 -> 20 (daha erken aktif taramaya zorla)
  collision_penalty: 30.0   # v4.5 ile aynı (güvenlik)
  far_voxel_bonus: 1.0      # v4.5 ile aynı (1.5 güvenliği bozuyordu)
ppo:
  policy: MlpPolicy
  learning_rate: 0.0003
  lr_schedule: linear
  lr_final: 1.0e-05
  n_steps: 1024
  batch_size: 512
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.008
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch:
      pi: [256, 256]
      vf: [256, 256]
train:
  version: fast_v4_7
  n_envs: 8
  total_timesteps: 4000000   # 2M -> 4M (güvenli politikayı derinleştir)
  save_freq: 100000
  resume_from: null
  log_dir: ./runs/fast_v4_7
  ckpt_dir: ./runs/fast_v4_7/checkpoints
  tb_log: ./runs/fast_v4_7/tb
  vec_normalize:
    enabled: true
    norm_obs: false
    norm_reward: true
    clip_reward: 10.0
