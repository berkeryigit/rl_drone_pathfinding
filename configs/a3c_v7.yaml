# a3c_v7 — A2C KARARLILIK: n_steps 16->32 (daha uzun rollout, daha stabil advantage) + gae_lambda 0.95->0.98 (daha az bias). A2C kisa-rollout gurultusunu azaltir.
# A3C(=A2C senkron) | DISCRETE aksiyon | numpy hizli sim | 1.5M step | her biri kumulatif iyilesme
env:
  max_episode_steps: 2500
  seed: 42
  lidar_history: 2
  room_bonus: 30.0
  idle_penalty: 0.05
  idle_grace: 30
  collision_penalty: 25.0
  far_voxel_bonus: 1.0
a2c:
  policy: MlpPolicy
  learning_rate: 0.0007
  lr_schedule: linear
  lr_final: 0.0001
  n_steps: 32
  gamma: 0.99
  gae_lambda: 0.98
  ent_coef: 0.02
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_rms_prop: true
  normalize_advantage: false
  policy_kwargs:
    net_arch: [256, 256]
train:
  version: a3c_v7
  n_envs: 8
  total_timesteps: 1500000
  save_freq: 150000
  resume_from: null
  log_dir: ./runs/a3c_v7
  ckpt_dir: ./runs/a3c_v7/checkpoints
  tb_log: ./runs/a3c_v7/tb
  vec_normalize:
    enabled: true
    norm_obs: false
    norm_reward: true
    clip_reward: 10.0
