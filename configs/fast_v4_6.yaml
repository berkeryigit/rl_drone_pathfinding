# v4.6 — FINAL: v4.5'in güvenli breadth'ini koru + daha derin tarama + uzun eğitim.
#   v4.5 dersi: collision 30 => çarpışma %8, 5 oda, %95 hayatta kal — AMA temkinli (114 voxel).
#   v4.6 fikri: güvenliği bozma (collision 30 kalır), ama:
#     - far_voxel 1.0->1.5 (uzak odaları daha derin taramayı ödüllendir)
#     - 3M eğitim (2M değil): güvenli + DERİN taramayı öğrenecek zaman.
#   Hedef: çarpışma <%15 KORU, voxel 114 -> 140+, union kapsama 15.6% -> 22%+.
env:
  max_episode_steps: 2500
  seed: 42
  lidar_history: 2
  room_bonus: 30.0
  idle_penalty: 0.06
  idle_grace: 30
  collision_penalty: 30.0    # v4.5 ile aynı (güvenliği koru)
  far_voxel_bonus: 1.5       # 1.0 -> 1.5 (uzak odaları daha derin tara)
ppo:
  policy: MlpPolicy
  learning_rate: 0.0003
  lr_schedule: linear
  lr_final: 1.0e-05
  n_steps: 1024
  batch_size: 512
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.008
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch:
      pi: [256, 256]
      vf: [256, 256]
train:
  version: fast_v4_6
  n_envs: 8
  total_timesteps: 3000000    # 2M -> 3M (final: güvenli+derin taramayı öğren)
  save_freq: 100000
  resume_from: null
  log_dir: ./runs/fast_v4_6
  ckpt_dir: ./runs/fast_v4_6/checkpoints
  tb_log: ./runs/fast_v4_6/tb
  vec_normalize:
    enabled: true
    norm_obs: false
    norm_reward: true
    clip_reward: 10.0
