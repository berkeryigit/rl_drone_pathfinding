# v4.1 — oda bonusu 10->30 (genişlik: uzak odalara çekim). lidar_history=2 taban, 2M.
env:
  max_episode_steps: 2500
  seed: 42
  lidar_history: 2
  room_bonus: 30.0          # v4.0'da 10 -> 30 (DEĞİŞEN: yeni odaya gitmeyi çok ödüllendir)
  idle_penalty: 0.05
  idle_grace: 40
  collision_penalty: 10.0
  far_voxel_bonus: 0.0
ppo:
  policy: MlpPolicy
  learning_rate: 0.0003
  lr_schedule: linear
  lr_final: 1.0e-05
  n_steps: 1024
  batch_size: 512
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.008
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch:
      pi: [256, 256]
      vf: [256, 256]
train:
  version: fast_v4_1
  n_envs: 8
  total_timesteps: 2000000
  save_freq: 100000
  resume_from: null
  log_dir: ./runs/fast_v4_1
  ckpt_dir: ./runs/fast_v4_1/checkpoints
  tb_log: ./runs/fast_v4_1/tb
  vec_normalize:
    enabled: true
    norm_obs: false
    norm_reward: true
    clip_reward: 10.0
