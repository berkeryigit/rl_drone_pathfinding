# v4.3 — DENGE: breadth'i koru (5 oda) ama güvenliği geri getir (çarpışma↓).
#   v4.2 dersi: agresif breadth+yüksek entropi -> 5 oda AMA %85 çarpışma.
#   v4.3: entropi 0.02->0.01 (gürültü↓), collision 10->14 (güvenlik↑), far_voxel 2.5->1.5,
#         idle 0.15->0.10 (daha yumuşak). Hedef: ~5 oda + çarpışma ~%20-30.
env:
  max_episode_steps: 2500
  seed: 42
  lidar_history: 2
  room_bonus: 30.0
  idle_penalty: 0.10
  idle_grace: 25
  collision_penalty: 14.0   # 10 -> 14 (riskli geçişleri caydır)
  far_voxel_bonus: 1.5      # 2.5 -> 1.5 (ölçülü breadth)
ppo:
  policy: MlpPolicy
  learning_rate: 0.0003
  lr_schedule: linear
  lr_final: 1.0e-05
  n_steps: 1024
  batch_size: 512
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01            # 0.02 -> 0.01 (gürültü azalt -> güvenli yürütme)
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch:
      pi: [256, 256]
      vf: [256, 256]
train:
  version: fast_v4_3
  n_envs: 8
  total_timesteps: 2000000
  save_freq: 100000
  resume_from: null
  log_dir: ./runs/fast_v4_3
  ckpt_dir: ./runs/fast_v4_3/checkpoints
  tb_log: ./runs/fast_v4_3/tb
  vec_normalize:
    enabled: true
    norm_obs: false
    norm_reward: true
    clip_reward: 10.0
