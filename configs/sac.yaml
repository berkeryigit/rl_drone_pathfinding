env:
  world_name: multi_room
  drone_name: rl_drone
  max_episode_steps: 500
  seed: 42
  frame_stack: 1
  curriculum_stage: easy
  manage_obstacles: true

sac:
  policy: MlpPolicy
  learning_rate: 3.0e-4
  buffer_size: 150000
  learning_starts: 5000
  batch_size: 128
  tau: 0.005
  gamma: 0.99
  train_freq: [4, step]
  gradient_steps: 1
  target_update_interval: 2
  ent_coef: auto
  target_entropy: auto
  use_sde: false
  optimize_memory_usage: false
  torch_compile: false
  policy_kwargs:
    net_arch: [256, 256]

train:
  total_timesteps: 120000
  save_freq: 20000
  eval_freq: 30000
  n_eval_episodes: 1
  curriculum:
    enabled: true
    easy_timesteps: 20000
    normal_stage: normal
  log_dir: ./runs/sac_fast_rooms
  ckpt_dir: ./runs/sac_fast_rooms/checkpoints
  tb_log: ./runs/sac_fast_rooms/tb
  resume_from: null
