# ============================================================================
# PPO config — v10 HAZIR (2026-06-02)
#
#   v3.0 Gazebo run 610k/1.5M adımda kasıtlı durduruldu (peak=110.3).
#   fast_sim zinciri (v4.1→v5.0, 18 config) tamamen kapandı.
#   v10 = v3.0 ile AYNI hyperparametreler (kanıtlanmış optimal) + yeni dizinler.
#
#   fast_sim kesinleşmiş bulgular (v10 env koduna yansıtılacak):
#     * collision_penalty: 10 → 25 (drone_exploration_env.py) — v4.8: %0 çarpışma
#     * lidar_history: 1 → 2 (drone_exploration_env.py, obs 41-d→72-d) — eval gap fix
#     * total_timesteps 1.5M üst sınır — 2M+ sonrası güvenlik kollapsu (v4.10/v4.11)
#   Tek sim/tek env (n_envs=1). Sabit harita+R0 spawn, 2D action [v,w].
# ============================================================================
env:
  drone_name: rl_drone
  max_episode_steps: 2500    # UZUN episode (Berker: max voxel icin daha cok gezsin)
  seed: 42
  world_name: multi_room

ppo:
  policy: MlpPolicy
  learning_rate: 0.0003      # FRESH -> tam lr schedule
  lr_schedule: linear        # 3e-4 -> 1e-5 (1.5M boyunca dogrusal)
  lr_final: 1.0e-05
  n_steps: 2048
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.008            # biraz daha kesif (oda-ici tarama tesviki)
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch:
      pi: [256, 256]
      vf: [256, 256]

train:
  version: v10
  n_envs: 1
  total_timesteps: 1500000
  save_freq: 25000
  resume_from: null          # FRESH 1.5M
  log_dir: ./runs/ppo_v10
  ckpt_dir: ./runs/ppo_v10/checkpoints
  tb_log: ./runs/ppo_v10/tb
  vec_normalize:
    enabled: true
    norm_obs: false
    norm_reward: true
    clip_reward: 10.0
