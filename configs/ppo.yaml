# ============================================================================
# PPO config — v2.0 TEMIZ BASELINE (2026-05-31, sifirdan yeniden tasarlandi)
#
#   * Tek sim, tek env (n_envs=1). Coklu env/gazebo YOK — gecmiste surekli bozdu.
#   * Sabit harita (multi_room), sabit baslangic (R0), 2D action [v, w].
#   * Temiz odul: return ~= kesfedilen voxel sayisi.
#   * Versiyon ilerlemesi: operator agent v2.1, v2.2 ... olarak gunceller,
#     her seferinde log_dir/ckpt_dir/tb_log degisir, 'version' alani guncellenir.
# ============================================================================
env:
  drone_name: rl_drone
  max_episode_steps: 1500    # v2.1: 1000->1500, carpismazsa daha cok gezsin
  seed: 42
  world_name: multi_room

ppo:
  policy: MlpPolicy
  learning_rate: 5.0e-05     # v2.1 500k->700k fine-tune: 3e-4->5e-5
                             # Sebep: SB3 resume'da LR progress_remaining=1'den
                             # basliyor (train_resume_500k.log: step 250k'da
                             # LR=0.0003 gozlemlendi; linear decay olsaydi ~2e-4).
                             # 500k+ politikasini 3e-4 ile fine-tune etmek
                             # ep_rew_mean'i -12.7->-25.5 geriliyor. 5e-5 stabil.
  lr_schedule: linear        # 5e-5 -> lr_final boyunca dogrusal azalir
  lr_final: 1.0e-05
  n_steps: 2048              # n_envs=1 -> rollout = 2048
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005            # kesfi tesvik et (drone gezsin)
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch:
      pi: [128, 128]
      vf: [128, 128]

train:
  version: v2.2
  n_envs: 1
  total_timesteps: 500000    # v2.2 fresh 500k (v2.1 eval: directional-only carpismayi dusurmedi)
  save_freq: 20000
  resume_from: null          # FRESH — v2.2 = her-yon caution (v2.0) + ileri-ark (v2.1) birlesik
  log_dir: ./runs/ppo_v2_2
  ckpt_dir: ./runs/ppo_v2_2/checkpoints
  tb_log: ./runs/ppo_v2_2/tb
  vec_normalize:
    enabled: true
    norm_obs: false          # obs zaten [-1,1]/[0,1] -> restart'a dayanikli
    norm_reward: true        # value-fonksiyon olceklemesi icin
    clip_reward: 10.0
