# PPO hyperparameters for the rl_drone exploration env.
# Values follow SB3 defaults tuned for low-dim continuous control.

env:
  world_name: multi_room
  drone_name: rl_drone
  max_episode_steps: 1000
  seed: 42

ppo:
  policy: MlpPolicy
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005       # a touch of exploration bonus, room-first reward already pushes exploration
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch:
      pi: [128, 128]
      vf: [128, 128]

train:
  # 300k upper bound: with `timeout 90m` watchdog, the run will SIGINT before
  # this. Picked larger than expected throughput so the timeout (not learn())
  # is what ends the run, giving us "as many steps as we can in 90 minutes".
  total_timesteps: 300000
  save_freq: 10000
  log_dir: ./runs/ppo
  ckpt_dir: ./runs/ppo/checkpoints
  tb_log: ./runs/ppo/tb
  resume_from: null     # path to a .zip checkpoint, or null
