# PPO hyperparameters for the rl_drone exploration env.
# Values follow SB3 defaults tuned for low-dim continuous control.

env:
  world_name: multi_room
  drone_name: rl_drone
  max_episode_steps: 1000
  seed: 42

ppo:
  policy: MlpPolicy
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.02        # bumped 0.005->0.02: at 290k, policy collapsed to "hover in spawn room". Combined with 3x bigger discovery rewards in env.
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch:
      pi: [128, 128]
      vf: [128, 128]

train:
  # When resuming, this is the absolute target step count (model continues
  # from its loaded num_timesteps). Otherwise it's the from-scratch budget.
  total_timesteps: 2000000
  save_freq: 10000
  # v3 = v2 + multi-floor spawn (5 floor-0 + 2 floor-1 + 1 floor-2) +
  # floor bonus 100->200. At v2/140k, drone happily explored floor 0
  # rooms but never climbed; spawning on upper floors gives the value
  # function direct exposure to upper-floor states.
  # v1 -> runs/ppo/, v2 -> runs/ppo_v2_explore/, v3 -> runs/ppo_v3_floors/.
  log_dir: ./runs/ppo_v3_floors
  ckpt_dir: ./runs/ppo_v3_floors/checkpoints
  tb_log: ./runs/ppo_v3_floors/tb
  resume_from: ./runs/ppo_v2_explore/checkpoints/ppo_drone_140000_steps.zip
