env:
  world_name: multi_room
  drone_name: rl_drone
  max_episode_steps: 1000
  seed: 42
ppo:
  policy: MlpPolicy
  learning_rate: 0.0003
  lr_schedule: linear
  lr_final: 3.0e-05
  n_steps: 512
  batch_size: 256
  n_epochs: 5
  gamma: 0.99
  gae_lambda: 0.9
  clip_range: 0.1
  ent_coef: 0.0015
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch:
      pi:
      - 128
      - 128
      vf:
      - 128
      - 128
train:
  total_timesteps: 2500000
  save_freq: 10000
  log_dir: ./runs/ppo_v9_newmap
  ckpt_dir: ./runs/ppo_v9_newmap/checkpoints
  tb_log: ./runs/ppo_v9_newmap/tb
  n_envs: 2
  resume_from: null
  vec_normalize:
    enabled: true
    norm_obs: true
    norm_reward: true
    clip_reward: 10.0
