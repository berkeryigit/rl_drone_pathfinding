env:
  drone_name: rl_drone
  max_episode_steps: 1000
  seed: 42
  world_name: multi_room
ppo:
  batch_size: 256
  clip_range: 0.1
  ent_coef: 0.0015
  gae_lambda: 0.9
  gamma: 0.99
  learning_rate: 0.00015
  lr_final: 1.5e-05
  lr_schedule: linear
  max_grad_norm: 0.5
  n_epochs: 5
  n_steps: 512
  policy: MlpPolicy
  policy_kwargs:
    net_arch:
      pi:
      - 128
      - 128
      vf:
      - 128
      - 128
  vf_coef: 0.5
train:
  ckpt_dir: ./runs/ppo_v10/checkpoints
  log_dir: ./runs/ppo_v10
  n_envs: 4
  resume_from: runs/ppo_v10/checkpoints/ppo_drone_80000_steps.zip
  save_freq: 10000
  tb_log: ./runs/ppo_v10/tb
  total_timesteps: 2500000
  vec_normalize:
    clip_reward: 10.0
    enabled: true
    norm_obs: true
    norm_reward: true
