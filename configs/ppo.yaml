# PPO hyperparameters — v9 newmap (tek katli 6-odali bina, hareketli engeller)
# SAC branch'ten alinan yeni harita ve env icin fresh start.
# Obs space degisti: 46-d (3-katli) -> 41-d (tek katli, floor features kaldirildi).
# v8'in en iyi parametreleri korundu (VecNormalize, linear lr decay, clip 0.1).

env:
  world_name: multi_room
  drone_name: rl_drone
  max_episode_steps: 1000
  seed: 42

ppo:
  policy: MlpPolicy
  learning_rate: 3.0e-4
  # Linear lr decay: yeni harita icin kesif suresi uzun olabilir.
  lr_schedule: linear
  lr_final: 3.0e-5
  # n_steps=512 * n_envs=4 = 2048 total rollout (v8 ile ayni)
  n_steps: 512
  batch_size: 256
  n_epochs: 5
  gamma: 0.99
  gae_lambda: 0.9
  clip_range: 0.1
  # 0.003: v8'in 0.001'inden biraz yuksek; yeni haritada 6 oda varsa
  # daha fazla kesif gerekiyor. Entropy explosion tehlikesi yok cunku
  # VecNormalize reward magnitude'i normalize ediyor.
  ent_coef: 0.003
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch:
      pi: [128, 128]
      vf: [128, 128]

train:
  total_timesteps: 2500000
  save_freq: 10000
  log_dir: ./runs/ppo_v9_newmap
  ckpt_dir: ./runs/ppo_v9_newmap/checkpoints
  tb_log: ./runs/ppo_v9_newmap/tb
  # n_envs=2: 4 iken SubprocVecEnv deadlock (unix_stream_read_generic) yasandi.
  # Kök neden: worker içi subprocess.Popen pipe'ı bozuyordu; düzeltildi.
  # 2 env: daha az pipe karmaşıklığı, ~80 FPS yeterli.
  n_envs: 2
  # Fresh start: obs space degisti (46->41), eski checkpoint kullanilamaz.
  resume_from: null
  vec_normalize:
    enabled: true
    norm_obs: true
    norm_reward: true
    clip_reward: 10.0
