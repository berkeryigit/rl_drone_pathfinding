# ============================================================================
# PPO config — v3.0 EN İYİ SÜRÜM + iyileştirmeler, 1.5M (2026-05-31)
#
#   Üçlü 100-ep eval sonucu: v2.0 ödülü KAZANDI (çarpışma %70 / kapsama %36).
#   v2.1 (yön-duyarlı) ve v2.2 (birleşik caution) ELENDİ (kötüleştirdi).
#   v3.0 = v2.0 ödülü + Berker'in istediği iyileştirmeler:
#     * UZUN episode (2500) — maksimum voxel için daha çok gezme zamanı
#     * net_arch [256,256] — daha zengin politika (1.5M için)
#     * ent_coef 0.008 — biraz daha keşif (oda-içi tarama)
#     * lr 3e-4 -> 1e-5 linear, 1.5M boyunca
#   Tek sim/tek env (n_envs=1). Sabit harita+R0 spawn, 2D action [v,w].
# ============================================================================
env:
  drone_name: rl_drone
  max_episode_steps: 2500    # UZUN episode (Berker: max voxel icin daha cok gezsin)
  seed: 42
  world_name: multi_room

ppo:
  policy: MlpPolicy
  learning_rate: 0.0003      # FRESH -> tam lr schedule
  lr_schedule: linear        # 3e-4 -> 1e-5 (1.5M boyunca dogrusal)
  lr_final: 1.0e-05
  n_steps: 2048
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.008            # biraz daha kesif (oda-ici tarama tesviki)
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch:
      pi: [256, 256]
      vf: [256, 256]

train:
  version: v3.0
  n_envs: 1
  total_timesteps: 1500000
  save_freq: 25000
  resume_from: null          # FRESH 1.5M
  log_dir: ./runs/ppo_v3_best
  ckpt_dir: ./runs/ppo_v3_best/checkpoints
  tb_log: ./runs/ppo_v3_best/tb
  vec_normalize:
    enabled: true
    norm_obs: false
    norm_reward: true
    clip_reward: 10.0
