# PPO hyperparameters for the rl_drone exploration env.
# Values follow SB3 defaults tuned for low-dim continuous control.

env:
  world_name: multi_room
  drone_name: rl_drone
  max_episode_steps: 1000
  seed: 42

ppo:
  policy: MlpPolicy
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.001       # v4: dropped 0.02->0.001. v3 plot showed entropy EXPLOSION (std 1->14, eval rooms=1 in deterministic). High ent_coef + large rewards (oda+50, kat+200) made policy maximize entropy via huge std rather than learning a good mean action.
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch:
      pi: [128, 128]
      vf: [128, 128]

train:
  # When resuming, this is the absolute target step count (model continues
  # from its loaded num_timesteps). Otherwise it's the from-scratch budget.
  total_timesteps: 2000000
  save_freq: 10000
  # v4 = v3 + idle penalty time-decay (no new voxel for >=30 steps -> -0.5
  # instead of -0.1) + ent_coef 0.02->0.001 to fix the entropy explosion
  # that drove std from 1 to 14 in v3 (-> deterministic eval = "rooms=1
  # in 10/11 eps"). Resumed from v3's peak (440k) instead of fresh, so
  # the partially-learned floor navigation isn't thrown away.
  # v1 -> runs/ppo/, v2 -> runs/ppo_v2_explore/, v3 -> runs/ppo_v3_floors/,
  # v4 -> runs/ppo_v4_low_ent/.
  log_dir: ./runs/ppo_v4_low_ent
  ckpt_dir: ./runs/ppo_v4_low_ent/checkpoints
  tb_log: ./runs/ppo_v4_low_ent/tb
  resume_from: null     # v4 fresh start (idle decay + low ent_coef = farklı reward landscape, eski policy fayda etmez)
