# PPO hyperparameters for the rl_drone exploration env.
# Values follow SB3 defaults tuned for low-dim continuous control.

env:
  world_name: multi_room
  drone_name: rl_drone
  max_episode_steps: 1000
  seed: 42

ppo:
  policy: MlpPolicy
  learning_rate: 3.0e-4
  # v7: linear lr decay 3e-4 -> 3e-5 across the run. v6 reached the
  # highest peak so far (+110 raw reward at 150k) but still drifted to
  # +85 by 235k. Constant lr keeps making large updates after the policy
  # has converged on a near-optimum, eroding it. Linear decay shrinks
  # the per-step shift as we approach the end so peak is preserved.
  lr_schedule: linear
  lr_final: 3.0e-5
  n_steps: 2048
  batch_size: 256       # v5: 64->256. Larger minibatch -> lower-variance gradient estimate -> more stable updates. v4 reward had +30/+85 oscillation post-peak; this kills the noise.
  n_epochs: 5           # v5: 10->5. Half the gradient passes per rollout, less per-rollout overfit, smoother trajectory.
  gamma: 0.99
  gae_lambda: 0.9       # v5: 0.95->0.9. Slightly more bias for less variance in advantage estimates (fits high-magnitude reward env better).
  clip_range: 0.1       # v5: 0.2->0.1. Tighter PPO clip -> smaller per-step policy shift -> stops the "overshoot then regress" pattern in v3/v4.
  ent_coef: 0.001       # v4 fix: kept at 0.001 (was 0.02 -> entropy EXPLOSION std 1->14). v5 keeps this stable level.
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch:
      pi: [128, 128]
      vf: [128, 128]

train:
  # When resuming, this is the absolute target step count (model continues
  # from its loaded num_timesteps). Otherwise it's the from-scratch budget.
  total_timesteps: 2000000
  save_freq: 10000
  # v7 = v6 + linear lr decay. v6 VecNormalize çalıştı (smooth eğri,
  # peak +110 = v3-v5'in 2x'i) ama hâlâ peak-then-regress var (235k'da
  # +85'e düştü). Constant lr 3e-4 policy converge ettikten sonra hâlâ
  # büyük güncelleme yapıyor → en iyi politikayı kemiriyor. Linear decay
  # 3e-4 -> 3e-5 ile peak korunur.
  # v1 ppo, v2 explore, v3 floors, v4 low_ent, v5 stable, v6 normalized,
  # v7 lrdecay.
  log_dir: ./runs/ppo_v7_lrdecay
  ckpt_dir: ./runs/ppo_v7_lrdecay/checkpoints
  tb_log: ./runs/ppo_v7_lrdecay/tb
  resume_from: null     # fresh: VecNormalize running stats start at 0; resuming would mismatch reward scale.
  vec_normalize:
    enabled: true
    norm_obs: true
    norm_reward: true
    clip_reward: 10.0   # normalized reward clipped to ±10 (most signal preserved, only outlier kat +200 spikes get clipped)
