# PPO hyperparameters for the rl_drone exploration env.
# Values follow SB3 defaults tuned for low-dim continuous control.

env:
  world_name: multi_room
  drone_name: rl_drone
  max_episode_steps: 1000
  seed: 42

ppo:
  policy: MlpPolicy
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 256       # v5: 64->256. Larger minibatch -> lower-variance gradient estimate -> more stable updates. v4 reward had +30/+85 oscillation post-peak; this kills the noise.
  n_epochs: 5           # v5: 10->5. Half the gradient passes per rollout, less per-rollout overfit, smoother trajectory.
  gamma: 0.99
  gae_lambda: 0.9       # v5: 0.95->0.9. Slightly more bias for less variance in advantage estimates (fits high-magnitude reward env better).
  clip_range: 0.1       # v5: 0.2->0.1. Tighter PPO clip -> smaller per-step policy shift -> stops the "overshoot then regress" pattern in v3/v4.
  ent_coef: 0.001       # v4 fix: kept at 0.001 (was 0.02 -> entropy EXPLOSION std 1->14). v5 keeps this stable level.
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch:
      pi: [128, 128]
      vf: [128, 128]

train:
  # When resuming, this is the absolute target step count (model continues
  # from its loaded num_timesteps). Otherwise it's the from-scratch budget.
  total_timesteps: 2000000
  save_freq: 10000
  # v5 = v4 PPO update stabilization. Same env (idle decay + multi-floor
  # spawn + 3x rewards), same low ent_coef. Only PPO update mechanics
  # changed: tighter clip_range, smaller n_epochs, larger batch, lower
  # gae_lambda. Goal: kill the "fast peak then regress/oscillate" pattern
  # we saw in v3 (440k peak +95 -> 1.45M +45) and v4 (60k peak +85 ->
  # 310k osc +30/+85, mean +50).
  # v1 -> runs/ppo/, v2 -> runs/ppo_v2_explore/, v3 -> runs/ppo_v3_floors/,
  # v4 -> runs/ppo_v4_low_ent/, v5 -> runs/ppo_v5_stable/.
  log_dir: ./runs/ppo_v5_stable
  ckpt_dir: ./runs/ppo_v5_stable/checkpoints
  tb_log: ./runs/ppo_v5_stable/tb
  resume_from: null     # fresh start: PPO mechanics changed enough that v4's policy/value would drift (training data distribution shifts under new clip_range/n_epochs).
