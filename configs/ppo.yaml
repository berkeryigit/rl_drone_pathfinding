# PPO hyperparameters for the rl_drone exploration env.
# Values follow SB3 defaults tuned for low-dim continuous control.

env:
  world_name: multi_room
  drone_name: rl_drone
  max_episode_steps: 1000
  seed: 42

ppo:
  policy: MlpPolicy
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005       # a touch of exploration bonus, room-first reward already pushes exploration
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch:
      pi: [128, 128]
      vf: [128, 128]

train:
  # When resuming, this is the absolute target step count (model continues
  # from its loaded num_timesteps). Otherwise it's the from-scratch budget.
  total_timesteps: 500000
  save_freq: 10000
  log_dir: ./runs/ppo
  ckpt_dir: ./runs/ppo/checkpoints
  tb_log: ./runs/ppo/tb
  resume_from: ./runs/ppo/checkpoints/ppo_drone_248544_steps.zip
