# PPO hyperparameters for the rl_drone exploration env.
# Values follow SB3 defaults tuned for low-dim continuous control.

env:
  world_name: multi_room
  drone_name: rl_drone
  max_episode_steps: 1000
  seed: 42

ppo:
  policy: MlpPolicy
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.02        # bumped 0.005->0.02: at 290k, policy collapsed to "hover in spawn room". Combined with 3x bigger discovery rewards in env.
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch:
      pi: [128, 128]
      vf: [128, 128]

train:
  # When resuming, this is the absolute target step count (model continues
  # from its loaded num_timesteps). Otherwise it's the from-scratch budget.
  total_timesteps: 2000000
  save_freq: 10000
  # v2 = bumped exploration rewards (env code) + ent_coef 0.02 + 3x3 floor
  # holes (multi_room.sdf). v1 results live under ./runs/ppo/ — keep them
  # for the report ("we tried v1, it stalled in the spawn room").
  log_dir: ./runs/ppo_v2_explore
  ckpt_dir: ./runs/ppo_v2_explore/checkpoints
  tb_log: ./runs/ppo_v2_explore/tb
  resume_from: null
