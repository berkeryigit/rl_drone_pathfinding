# ============================================================================
# HIZLI numpy sim — 5M eğitim (Berker: çarpışmayı engelleyene kadar)
#   * fast_v1 (1.5M): çarpışma %47 (Gazebo v2.0 %70'ten iyi). Daha çok eğit.
#   * v2.0 ödülü, episode 2500, net [256,256], n_envs=8, FRESH 5M (~20 dk).
#   * runs/fast_5m — fast_v1 (1.5M) sonuçları korunur.
# ============================================================================
env:
  max_episode_steps: 2500
  seed: 42

ppo:
  policy: MlpPolicy
  learning_rate: 0.0003
  lr_schedule: linear
  lr_final: 1.0e-05
  n_steps: 1024
  batch_size: 512
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.008
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch:
      pi: [256, 256]
      vf: [256, 256]

train:
  version: fast_5m
  n_envs: 8
  total_timesteps: 5000000
  save_freq: 100000
  resume_from: null
  log_dir: ./runs/fast_5m
  ckpt_dir: ./runs/fast_5m/checkpoints
  tb_log: ./runs/fast_5m/tb
  vec_normalize:
    enabled: true
    norm_obs: false
    norm_reward: true
    clip_reward: 10.0
