# v4.9 — FRONTIER devamı: v4.8 (%0 çarpışma) güvenlik marjını voxel'e çevir.
#   v4.8 (collision 25) = %0 çarpışma / 117 voxel / 5 oda / %100 hayatta — büyük güvenlik marjı.
#   v4.9: collision 25 -> 22 (TEK DEĞİŞEN). Hipotez: marjı kullanıp ~125-135 voxel,
#         çarpışma hâlâ düşük (<%15). Geçmezse v4.8 nihai.
#   DİĞER HER ŞEY v4.8/v4.5 ile AYNI (idle 0.06/grace30, far 1.0).
env:
  max_episode_steps: 2500
  seed: 42
  lidar_history: 2
  room_bonus: 30.0
  idle_penalty: 0.06
  idle_grace: 30
  collision_penalty: 22.0   # 25 -> 22 (TEK DEĞİŞEN: marjı voxel'e çevir)
  far_voxel_bonus: 1.0
ppo:
  policy: MlpPolicy
  learning_rate: 0.0003
  lr_schedule: linear
  lr_final: 1.0e-05
  n_steps: 1024
  batch_size: 512
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.008
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch:
      pi: [256, 256]
      vf: [256, 256]
train:
  version: fast_v4_9
  n_envs: 8
  total_timesteps: 2000000
  save_freq: 100000
  resume_from: null
  log_dir: ./runs/fast_v4_9
  ckpt_dir: ./runs/fast_v4_9/checkpoints
  tb_log: ./runs/fast_v4_9/tb
  vec_normalize:
    enabled: true
    norm_obs: false
    norm_reward: true
    clip_reward: 10.0
