# Windows 11 (WSL2 + Docker Desktop + WSLg) icin docker-compose.
# WSLg sayesinde VcXsrv gerekmez — WSL2'nin X11 soketi dogrudan baglanir.
services:
  rl_drone:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        USER_UID: "1000"
        USER_GID: "1000"
    image: rl_drone_pathfinding:latest
    container_name: rl_drone
    network_mode: bridge
    ipc: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY:-:0}        # WSLg ile otomatik :0 olur
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=0
      - XDG_RUNTIME_DIR=/tmp/runtime-dev
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      - ../:/workspace:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw   # WSLg X11 soketi
    # NVIDIA GPU varsa bu blogu birak, yoksa sil:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
