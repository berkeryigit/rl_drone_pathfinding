env:
  world_name: multi_room
  drone_name: rl_drone
  max_episode_steps: 1000
  seed: 42
  frame_stack: 1

sac:
  policy: MlpPolicy
  learning_rate: 3.0e-4
  buffer_size: 300000
  learning_starts: 5000
  batch_size: 512
  tau: 0.005
  gamma: 0.99
  train_freq: [1, step]
  gradient_steps: 1
  ent_coef: auto
  target_entropy: auto
  use_sde: true
  optimize_memory_usage: false
  policy_kwargs:
    net_arch: [512, 512]

train:
  total_timesteps: 300000
  save_freq: 10000
  eval_freq: 20000
  n_eval_episodes: 5
  log_dir: ./runs/sac
  ckpt_dir: ./runs/sac/checkpoints
  tb_log: ./runs/sac/tb
  resume_from: null
